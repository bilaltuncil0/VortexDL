name: Cross-Platform Build & Release

on:
  push:
    branches:
      - main
      - feature/modular-download-architecture
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            binary_name: VortexDL
            asset_name: VortexDL-Linux-x86_64
          - os: windows-latest
            binary_name: VortexDL.exe
            asset_name: VortexDL-Windows-x64.exe
          - os: macos-15-intel
            binary_name: VortexDL
            asset_name: VortexDL-macOS-x64.dmg

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y ffmpeg aria2 gettext python3-tk

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg aria2 gettext || true

      - name: Install System Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg aria2 || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Headless Sanity Check
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m py_compile $(find vortexdl -name '*.py') app.py downloader.py
          python -X utf8 -c "import app, downloader; from vortexdl.core.models import DownloadTask, DownloadEvent; from vortexdl.services.download_service import DownloadQueueService; print('Tüm importlar ve modüller hatasız.')"

      - name: Compile Translations
        run: |
          python -c "
          import subprocess, os
          for lang in ['tr_TR', 'en_US', 'de_DE', 'fr_FR', 'it_IT', 'ar_SA', 'zh_CN']:
              po = os.path.join('locales', lang, 'LC_MESSAGES', 'videodownloader.po')
              mo = os.path.join('locales', lang, 'LC_MESSAGES', 'videodownloader.mo')
              if os.path.exists(po):
                  subprocess.run(['msgfmt', po, '-o', mo], check=False)
          " || true

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean VortexDL.spec

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/VortexDL
          cp dist/VortexDL ${{ matrix.asset_name }}

      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          Copy-Item dist/VortexDL.exe -Destination ${{ matrix.asset_name }}

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          APP_BUNDLE="dist/VortexDL.app"
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          cp dist/VortexDL "$APP_BUNDLE/Contents/MacOS/VortexDL"
          chmod +x "$APP_BUNDLE/Contents/MacOS/VortexDL"
          cat > "$APP_BUNDLE/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>VortexDL</string>
            <key>CFBundleIdentifier</key><string>com.bilaltuncil.vortexdl</string>
            <key>CFBundleName</key><string>VortexDL</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>3.0.0</string>
            <key>CFBundleVersion</key><string>3.0.0</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          hdiutil create -volname "VortexDL" -srcfolder "$APP_BUNDLE" -ov -format UDZO "${{ matrix.asset_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Prepare assets list
        id: assets
        run: |
          mkdir -p final_assets
          find release_assets/ -type f -exec cp {} final_assets/ \;
          ls -la final_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "VortexDL ${{ github.ref_name }} — Ultimate Release"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: final_assets/*
